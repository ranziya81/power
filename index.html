<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>교구대여 달력 · 샘플</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182235;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:900px;margin:35px auto;padding:0 20px}.top{margin-bottom:24px}.top h1{font-size:28px;margin:0 0 5px}.top p{color:#64748b;margin:0}.panel{background:#fff;border:1px solid #e6eaf0;box-shadow:0 8px 32px #1c35500b;border-radius:18px;padding:24px}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.monthbar h2{font-size:21px;margin:0}.nav{display:flex;gap:8px}.nav button{border:1px solid #dce3ed;background:#fff;border-radius:9px;padding:8px 14px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{padding:10px 0;text-align:center;color:#64748b;font-size:13px}.week div:first-child{color:#ef6d74}.week div:last-child{color:#4d7fce}.day{min-height:91px;border:1px solid #eef1f5;margin:-.5px;padding:8px;overflow:hidden}.day.muted{background:#fafbfc;color:#c2c8d1}.day.today .num{background:#315ed8;color:#fff}.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px}.entry{margin-top:4px;border-radius:5px;background:#e8f2ff;color:#1e58a2;padding:3px 5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{display:flex;justify-content:center;margin-top:24px}.primary{border:0;border-radius:11px;background:#315ed8;color:white;padding:13px 32px;font-weight:700}.hint{text-align:center;color:#8791a3;font-size:12px;margin-top:15px}.overlay{position:fixed;inset:0;background:#18223587;display:none;place-items:center;padding:16px;z-index:10}.overlay.open{display:grid}.modal{background:white;border-radius:17px;padding:25px;width:min(100%,420px);box-shadow:0 18px 55px #0002}.modalheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalheader h2{margin:0;font-size:21px}.close{border:0;background:transparent;font-size:25px;color:#64748b}.field{margin-bottom:16px}.field label{display:block;font-size:14px;font-weight:650;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd5e1;padding:12px;border-radius:9px}.actions{display:flex;gap:8px;margin-top:22px}.actions button{flex:1;padding:12px;border-radius:9px}.cancel{border:1px solid #d8dfeb;background:white}.submit{border:0;background:#315ed8;color:#fff;font-weight:650}@media(max-width:600px){main{margin:18px auto;padding:0 10px}.panel{padding:13px}.day{min-height:70px;padding:3px}.entry{font-size:10px;padding:2px}.monthbar h2{font-size:18px}.top h1{font-size:23px}}
</style>
</head>
<body>
<main><header class="top"><h1>교구대여 달력</h1><p>대여 일정을 달력에서 확인해 보세요.</p></header><section class="panel" aria-label="교구대여 달력"><div class="monthbar"><h2 id="monthTitle"></h2><div class="nav"><button id="prev" aria-label="이전 달">‹</button><button id="today">오늘</button><button id="next" aria-label="다음 달">›</button></div></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div><div class="bottom"><button class="primary" id="add">+ 교구대여</button></div><p class="hint">샘플 화면입니다. 입력한 대여 내역은 현재 브라우저에만 저장됩니다.</p></section></main>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modalheader"><h2 id="dialogTitle">교구대여 신청</h2><button class="close" id="close" aria-label="닫기">×</button></div><form id="form"><div class="field"><label for="name">이름</label><input id="name" name="name" required maxlength="40" placeholder="대여자 이름"></div><div class="field"><label for="start">날짜 (시작)</label><input id="start" name="start" type="date" required></div><div class="field"><label for="end">날짜 (끝)</label><input id="end" name="end" type="date" required></div><div class="actions"><button type="button" class="cancel" id="cancel">취소</button><button class="submit" type="submit">대여 등록</button></div></form></div></div>
<script>
(() => {
const key='power-equipment-demo-v1', now=new Date();let year=now.getFullYear(),month=now.getMonth();let entries=[];
try{const raw=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(raw))entries=raw.filter(x=>x&&typeof x.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.start)&&/^\d{4}-\d{2}-\d{2}$/.test(x.end));}catch{}
const $=id=>document.getElementById(id),dateStr=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function render(){
$('monthTitle').textContent=year+'년 '+(month+1)+'월';const grid=$('days');grid.replaceChildren();const first=new Date(year,month,1),offset=first.getDay(),total=new Date(year,month+1,0).getDate(),cells=Math.ceil((offset+total)/7)*7;
for(let i=0;i<cells;i++){const d=new Date(year,month,1-offset+i),ds=dateStr(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==month?' muted':'')+(ds===dateStr(now)?' today':'');const num=document.createElement('span');num.className='num';num.textContent=d.getDate();cell.append(num);for(const item of entries){if(item.start<=ds&&item.end>=ds){const tag=document.createElement('div');tag.className='entry';tag.textContent=item.name;tag.title=item.name+' ('+item.start+' ~ '+item.end+')';cell.append(tag);}}grid.append(cell);}
}
function open(){const ds=dateStr(now);$('start').value=ds;$('end').value=ds;$('overlay').classList.add('open');$('name').focus()}
function close(){$('overlay').classList.remove('open');$('form').reset()}
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};
$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};
$('today').onclick=()=>{year=now.getFullYear();month=now.getMonth();render()};
$('add').onclick=open;$('close').onclick=close;$('cancel').onclick=close;
$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),start=$('start').value,end=$('end').value;if(!name)return alert('이름을 입력해 주세요.');if(end<start)return alert('종료일은 시작일 이후여야 합니다.');entries.push({name,start,end});try{localStorage.setItem(key,JSON.stringify(entries))}catch{alert('브라우저에 저장하지 못했습니다.')}year=Number(start.slice(0,4));month=Number(start.slice(5,7))-1;render();close()};
render();
})();
</script>
</body></html>
