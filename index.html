<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f3ed" />
  <title>하루의 문장 | 나의 음성 일기</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="#" class="brand" aria-label="하루의 문장 홈"><span class="brandmark">✳</span> 하루의 문장 <small>VOICE DIARY</small></a>
      <div class="userbar"><span class="useremail">자동 연결 · Supabase</span></div>
    </header>

    <main>
      <section id="diaryView">
        <div id="dbStatus" role="status" aria-live="polite" style="padding:12px 16px;margin:18px 0;background:#fff3d8;border:1px solid #e9d2a3;border-radius:12px;color:#775b25;font-size:14px">⏳ Supabase DB 연결 중입니다…</div>
        <div class="page-heading"><div><span class="eyebrow">MY DAILY RECORD</span><h1>오늘을 기록하는 시간<span class="dot">.</span></h1><p class="muted">완벽한 문장이 아니어도 괜찮아요. 있는 그대로 남겨보세요.</p></div><div class="today-stamp" id="todayLabel"></div></div>
        <div class="diary-grid">
          <div class="editor-column">
            <form id="diaryForm" class="surface editor-card">
              <div class="card-top"><div><span class="eyebrow">WRITE YOUR STORY</span><h2 id="editorHeading">새로운 일기</h2></div><span class="pill" id="editPill">새 기록</span></div>
              <div class="fields-row"><div class="field"><label for="entryDate">날짜</label><input type="date" id="entryDate" required /></div><div class="field"><label for="entryTitle">제목</label><input type="text" id="entryTitle" maxlength="120" placeholder="오늘 하루를 한마디로" /></div></div>
              <label for="entryContent">나의 이야기</label>
              <textarea id="entryContent" rows="10" maxlength="20000" placeholder="오늘은 어떤 하루였나요? 마이크를 눌러 편하게 이야기해도 좋아요."></textarea>
              <div class="record-box"><button id="recordBtn" type="button" class="mic-button" aria-pressed="false"><span class="mic-icon">🎙</span><span id="recordLabel">말로 일기 쓰기</span></button><div class="record-help"><span id="speechStatus">마이크를 누르면 음성이 글자로 바뀌어요.</span><small>Chrome·Edge 권장 · 음성 파일은 저장하지 않음</small></div></div>
              <div class="editor-actions"><button type="button" id="clearBtn" class="secondary">새 일기</button><button type="submit" id="saveBtn" class="primary">일기 저장하기 <span aria-hidden="true">↗</span></button></div>
              <p class="notice" id="editorMessage" role="status"></p>
            </form>
          </div>
          <aside class="list-column"><div class="surface list-card"><div class="card-top"><div><span class="eyebrow">YOUR MEMORIES</span><h2>나의 기록 <span id="entryCount" class="count">0</span></h2></div></div><div class="filter-row"><label for="filterDate">날짜별 보기</label><button id="resetFilterBtn" class="text-button" type="button">전체 보기</button></div><input type="date" id="filterDate" aria-label="일기 조회 날짜 선택" /><div id="entryList" class="entry-list" aria-live="polite"></div></div></aside>
        </div>
      </section>
    </main>
    <footer>작은 기록이 모여 나의 이야기가 됩니다. · 하루의 문장</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
