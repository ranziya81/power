<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT × GitHub 연결 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color: #202739; padding: 24px; }
    main { width: min(100%, 520px); padding: 44px 32px; background: white; border-radius: 24px; text-align: center; box-shadow: 0 12px 40px rgba(28,44,87,.09); }
    .mark { font-size: 44px; margin-bottom: 14px; }
    h1 { margin: 0 0 14px; font-size: 29px; }
    p { line-height: 1.8; color: #667085; }
    button { margin-top: 20px; padding: 14px 24px; border: 0; border-radius: 12px; background: #3458de; color: white; font-size: 16px; cursor: pointer; }
    #result { min-height: 28px; font-weight: 700; color: #246d4d; }
    small { display: block; margin-top: 22px; color: #9299a7; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✅</div>
    <h1>GitHub 연결 테스트 성공!</h1>
    <p>이 페이지는 ChatGPT가 직접 작성하고<br>GitHub 저장소에 추가한 테스트 파일입니다.</p>
    <button type="button" id="testButton">버튼 동작 테스트</button>
    <p id="result" role="status" aria-live="polite"></p>
    <small>Repository: ranziya81/power · File: chatgpt-test.html</small>
  </main>
  <script>
    document.getElementById('testButton').addEventListener('click', () => {
      document.getElementById('result').textContent = '🎉 자바스크립트도 정상 작동합니다!';
    });
  </script>
</body>
</html>
